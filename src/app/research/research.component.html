<section class="research-page">
  <h2 class="section-title">Research</h2>
  <p class="intro">
    Current interests: causal inference, uncertainty quantification, and reliable statistical learning from observational data.
  </p>

  <div class="research-list">
    <article class="research-card" *ngFor="let item of researchItems">
      <p class="type-label">{{item.type}}</p>
      <h3>{{item.title}}</h3>
      <p class="meta">{{item.venue}} · {{item.date}}</p>
      <p class="summary">{{item.summary}}</p>

      <div class="link-row" *ngIf="item.links?.length">
        <a *ngFor="let link of item.links" [href]="link.href" target="_blank">{{link.label}}</a>
      </div>
    </article>
  </div>
</section>
